apply plugin: 'com.android.application'
android {
    namespace 'com.g45.ffnativo'
    compileSdk 33
    
    defaultConfig {
        applicationId "com.g45.ffnativo"
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName "1.0"
        
        ndk {
            abiFilters 'armeabi-v7a'
        }
    }
    
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}
dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
